[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viz-lib"
version = "0.1.0"
description = "A small visualisation library (import name: viz_lib)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "mkdocs",
]

[tool.setuptools.packages.find]
where = ["src"]
